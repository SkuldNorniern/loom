[package]
name = "game-client"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.128"

[dependencies.web-sys]
version = "0.3.77"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "EventSource",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "MessageEvent",
    "Performance",
    "PointerEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
